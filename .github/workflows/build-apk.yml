name: Build Extreme TV Optimizer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: unzip -o "ExtremeTVOptimizer_CODIGO_FONTE (1).zip" -d .

      - name: Aplicar implementacao Extreme TV
        run: |
          mkdir -p app/src/main/java/br/com/extremetv/optimizer
          cp overrides/MainActivity.kt app/src/main/java/br/com/extremetv/optimizer/MainActivity.kt

      - name: Configurar compatibilidade Java 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Arquivo app/build.gradle.kts nao encontrado.")
          s = p.read_text(encoding="utf-8")
          block = [
              "",
              "android {",
              "    compileOptions {",
              "        sourceCompatibility = JavaVersion.VERSION_17",
              "        targetCompatibility = JavaVersion.VERSION_17",
              "    }",
              "}",
              ""
          ]
          p.write_text(s + chr(10).join(block), encoding="utf-8")
          print("Compatibilidade Java configurada para JVM 17.")
          PY

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeTVOptimizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Auditar estrutura do projeto
        run: |
          echo "=== ARQUIVOS EXTRAIDOS ==="
          find . -maxdepth 5 -type f \
            ! -path './.git/*' ! -path './.gradle/*' \
            ! -path './build/*' | sort
          echo "=== FONTES ANDROID ==="
          find . -type f \( -name '*.kt' -o -name '*.java' -o -name '*.xml' -o -name '*.gradle' -o -name '*.kts' \) \
            ! -path './.gradle/*' ! -path './build/*' -print0 |
          while IFS= read -r -d '' file; do
            echo "===== $file ====="
            sed -n '1,260p' "$file"
          done
