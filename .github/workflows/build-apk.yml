name: Build Extreme TV Optimizer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: unzip -o "ExtremeTVOptimizer_CODIGO_FONTE (1).zip" -d .

      - name: Alinhar Java e Kotlin em 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Arquivo app/build.gradle.kts nao encontrado apos extrair o ZIP.")
          s = p.read_text(encoding="utf-8")
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          p.write_text(s, encoding="utf-8")
          print("Configuracao Java/Kotlin ajustada para 17.")
          PY

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeTVOptimizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
